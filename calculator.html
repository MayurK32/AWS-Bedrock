<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern CSS Calendar</title>
    <style>
        /* 1. General Reset & Layout */
        :root {
            --primary-color: #4f46e5; /* Indigo */
            --bg-color: #f3f4f6;
            --calendar-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --hover-bg: #eef2ff;
            --today-bg: #4f46e5;
            --today-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 2. Calendar Container */
        .calendar {
            background: var(--calendar-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* 3. Header (Month & Year) */
        .calendar-header {
            padding: 20px;
            text-align: center;
            background-color: var(--primary-color);
            color: white;
        }

        .month-year {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .selected-date {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* 4. Weekdays (Sun - Sat) */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding: 15px 10px 5px;
            background-color: #fff;
        }

        .weekdays div {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* 5. Days Grid */
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding: 10px;
            gap: 5px; /* Gap between day squares */
        }

        .day {
            aspect-ratio: 1; /* Makes the cell a perfect square */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-main);
            border-radius: 50%; /* Circular day indicator */
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .day:hover:not(.empty) {
            background-color: var(--hover-bg);
            color: var(--primary-color);
        }

        /* Style for the previous month's days */
        .day.prev-date, .day.next-date {
            color: #d1d5db;
            pointer-events: none; /* Optional: disable interaction */
        }

        /* Style for TODAY */
        .day.today {
            background-color: var(--primary-color);
            color: var(--today-text);
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        /* Empty cells for layout alignment */
        .day.empty {
            cursor: default;
        }

    </style>
</head>
<body>

    <div class="calendar">
        <div class="calendar-header">
            <div class="month-year" id="month-year"></div>
            <div class="selected-date" id="current-day-display">Today</div>
        </div>
        
        <div class="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div class="days" id="days">
            <!-- Days are injected by JavaScript -->
        </div>
    </div>

    <script>
        // 1. Select Elements
        const monthYearEl = document.getElementById('month-year');
        const daysEl = document.getElementById('days');
        const currentDayDisplay = document.getElementById('current-day-display');

        // 2. Setup Date Logic
        const date = new Date();
        
        // Get current month and year
        const curr_month = { value: date.getMonth() }; // Store as object to allow changing later easily
        const curr_year = { value: date.getFullYear() };

        const months = [
            "January", "February", "March", "April", "May", "June", 
            "July", "August", "September", "October", "November", "December"
        ];

        // 3. Render Function
        function renderCalendar() {
            // Get first day of the month (0-6)
            const firstDayofMonth = new Date(curr_year.value, curr_month.value, 1).getDay();
            // Get last date of the month (28-31)
            const lastDateofMonth = new Date(curr_year.value, curr_month.value + 1, 0).getDate();
            // Get last day of the month
            const lastDayofMonth = new Date(curr_year.value, curr_month.value, lastDateofMonth).getDay();
            // Get last date of previous month
            const lastDateofLastMonth = new Date(curr_year.value, curr_month.value, 0).getDate();

            let liTag = "";

            // 3a. Previous month padding days
            for (let i = firstDayofMonth; i > 0; i--) {
                liTag += `<div class="day prev-date">${lastDateofLastMonth - i + 1}</div>`;
            }

            // 3b. Current month days
            for (let i = 1; i <= lastDateofMonth; i++) {
                // Check if it is today
                const isToday = i === date.getDate() && 
                                curr_month.value === new Date().getMonth() && 
                                curr_year.value === new Date().getFullYear() 
                                ? "today" : "";
                
                liTag += `<div class="day ${isToday}" onclick="selectDate(${i})">${i}</div>`;
            }

            // 3c. Next month padding days
            for (let i = lastDayofMonth; i < 6; i++) {
                liTag += `<div class="day next-date">${i - lastDayofMonth + 1}</div>`;
            }

            // 4. Update Header
            monthYearEl.innerText = `${months[curr_month.value]} ${curr_year.value}`;
            
            // 5. Inject into DOM
            daysEl.innerHTML = liTag;
        }

        // Interaction: Click on a date
        function selectDate(day) {
            // Update the text in the header
            const formattedDate = `Selected: ${months[curr_month.value]} ${day}, ${curr_year.value}`;
            currentDayDisplay.innerHTML = formattedDate;
        }

        // Initialize
        renderCalendar();

    </script>
</body>
</html>
